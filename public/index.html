<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenWii</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; cursor: none;
    background: #e4eaf1; color: #33404f;
    font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }


  /* ── Calibration ─────────────────────────────────────────────────────── */
  #cal {
    position: absolute; inset: 0; z-index: 15; display: grid; place-items: center;
    background: rgba(240, 244, 249, 0.93); text-align: center; padding: 0 8vw;
  }
  #cal.hide { display: none; }
  #cal h2 { font-size: clamp(26px, 3.6vw, 44px); margin: 0 0 10px; letter-spacing: -0.03em; }
  #cal p { color: #64758a; margin: 0 auto; max-width: 520px; }

  /* ── Chrome ──────────────────────────────────────────────────────────── */
  #link {
    position: absolute; right: 22px; top: 20px; display: flex; align-items: center; gap: 9px;
    font-size: 12px; color: #6b7b8f; background: #ffffffcc; border: 1px solid #c9d4e0;
    padding: 8px 13px; border-radius: 999px; z-index: 10;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #b6c2d0; }
  .dot.on { background: #35d07f; }

  #pair {
    position: absolute; left: 22px; top: 20px; z-index: 10; display: flex; gap: 12px;
    align-items: center; background: #ffffffcc; border: 1px solid #c9d4e0;
    border-radius: 16px; padding: 11px 15px 11px 11px;
  }
  #pair img { width: 62px; height: 62px; border-radius: 8px; background: #fff; }
  #pair b { display: block; font-size: 11px; margin-bottom: 3px; }
  #pair-url { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #7a8b9e; }
  #pair { transition: opacity .4s ease, transform .4s ease; }
  #pair.gone { opacity: 0; transform: translateY(-8px); pointer-events: none; }

  #keys {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; color: #8494a7; z-index: 10; letter-spacing: .02em;
  }
  #debug {
    position: absolute; right: 22px; bottom: 22px; margin: 0; display: none; z-index: 10;
    background: #ffffffe6; border: 1px solid #c9d4e0; border-radius: 10px; padding: 12px 14px;
    font: 11px/1.6 ui-monospace, Menlo, monospace; color: #5c6e83; white-space: pre;
  }
  #debug.on { display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="cal" class="hide">
  <div>
    <h2 id="cal-title">Waiting for the remote</h2>
    <p id="cal-body">Open the controller page on your phone and tap Enable motion sensors.</p>
  </div>
</div>

<div id="pair">
  <img id="pair-qr" alt="Pairing QR code" />
  <div><b>Pair your phone</b><div id="pair-url">…</div></div>
</div>

<div id="link"><span class="dot" id="dot"></span><span id="link-t">no remote connected</span></div>

<div id="keys">Point with your phone · <b>A</b> selects · <b>B</b> back · R recalibrate · D debug</div>
<pre id="debug"></pre>


<script src="/socket.io/socket.io.js"></script>
<script type="module" src="menu.js"></script>
</body>
</html>
