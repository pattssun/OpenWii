<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenWii — your phone is the remote</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: #0b0e14; color: #e8ecf4;
    font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background: radial-gradient(ellipse at 50% 0%, #1a2233, #0b0e14 65%);
    padding: 64px 32px 80px; display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; margin-bottom: 44px; }
  h1 { font-size: 62px; margin: 0 0 8px; letter-spacing: -0.045em; font-weight: 800; }
  h1 em { font-style: normal;
    background: linear-gradient(120deg, #ff5f6d, #ffd166);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: #8b95ad; margin: 0; font-size: 17px; }

  /* Pairing: one remote, shared by every game — so it lives on the launcher. */
  #pair {
    display: flex; align-items: center; gap: 26px;
    background: #141926; border: 1px solid #232a3b; border-radius: 20px;
    padding: 22px; margin-bottom: 46px; max-width: 620px;
  }
  #pair img { width: 156px; height: 156px; border-radius: 12px; background: #fff; flex: none; }
  #pair b { display: block; font-size: 15px; margin-bottom: 6px; }
  #pair-url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    color: #ffd166; word-break: break-all;
  }
  #pair ol { color: #8b95ad; font-size: 13px; padding-left: 18px; margin: 12px 0 0; }
  #pair li { margin-bottom: 3px; }

  h2 {
    font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: #59637a; margin: 0 0 16px; align-self: flex-start; max-width: 900px; width: 100%;
  }
  #games {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px; width: 100%; max-width: 900px;
  }
  .game {
    display: block; text-decoration: none; color: inherit;
    background: #141926; border: 1px solid #232a3b; border-radius: 18px; padding: 24px;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .game:hover { transform: translateY(-3px); border-color: #ff5f6d66; background: #171d2c; }
  .game .emoji { font-size: 40px; display: block; margin-bottom: 12px; }
  .game b { font-size: 19px; display: block; margin-bottom: 5px; letter-spacing: -0.02em; }
  .game span { color: #8b95ad; font-size: 14px; }
  .empty { color: #59637a; font-size: 14px; }

  footer { margin-top: 56px; color: #59637a; font-size: 13px; text-align: center; }
  footer code {
    background: #141926; border: 1px solid #232a3b; border-radius: 5px;
    padding: 2px 7px; font-size: 12px; color: #8b95ad;
  }
</style>
</head>
<body>
  <header>
    <h1>🕹 <em>OpenWii</em></h1>
    <p>Motion-controlled games for your computer. Your phone is the remote.</p>
  </header>

  <div id="pair">
    <img id="pair-qr" alt="Pairing QR code" />
    <div>
      <b>Pair your phone</b>
      <div id="pair-url">…</div>
      <ol>
        <li>Same Wi-Fi as this computer</li>
        <li>Accept the certificate warning</li>
        <li>Tap <strong>Enable motion sensors</strong></li>
      </ol>
    </div>
  </div>

  <h2>Games</h2>
  <div id="games"><span class="empty">Loading…</span></div>

  <footer>
    Add a game by dropping a folder with an <code>index.html</code> into <code>games/</code>.
  </footer>

<script>
  fetch('/api/pairing')
    .then((r) => r.json())
    .then(({ url, qr }) => {
      document.getElementById('pair-qr').src = qr;
      document.getElementById('pair-url').textContent = url;
    })
    .catch(() => {
      document.getElementById('pair-url').textContent = 'open /controller on your phone';
    });

  fetch('/api/games')
    .then((r) => r.json())
    .then((games) => {
      const host = document.getElementById('games');
      if (!games.length) {
        host.innerHTML = '<span class="empty">No games found in games/.</span>';
        return;
      }
      host.innerHTML = '';
      for (const g of games) {
        const a = document.createElement('a');
        a.className = 'game';
        a.href = g.url;
        // textContent throughout: game.json is author-supplied, not markup.
        const emoji = document.createElement('span');
        emoji.className = 'emoji';
        emoji.textContent = g.emoji;
        const title = document.createElement('b');
        title.textContent = g.title;
        const tagline = document.createElement('span');
        tagline.textContent = g.tagline;
        a.append(emoji, title, tagline);
        host.append(a);
      }
    })
    .catch(() => {
      document.getElementById('games').innerHTML = '<span class="empty">Could not load games.</span>';
    });
</script>
</body>
</html>
