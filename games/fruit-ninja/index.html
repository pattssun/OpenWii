<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fruit Ninja — OpenWii</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; cursor: none;
    background: #2b1a0c; color: #f5ead6;
    font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .brush { font-family: "Permanent Marker", "Comic Sans MS", cursive; font-weight: 400; }

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  #hud { position: absolute; inset: 0; pointer-events: none; padding: 22px 30px; }

  #score-wrap { position: absolute; left: 30px; top: 18px; }
  #score-row { display: flex; align-items: center; gap: 12px; }
  #score-ico { font-size: 34px; filter: drop-shadow(0 3px 6px #0009); }
  #score-v {
    font-family: "Permanent Marker", cursive; font-size: 58px; line-height: 1; color: #fff;
    text-shadow: 0 0 2px #000, 3px 3px 0 #3a220c, 0 6px 18px #000c;
    font-variant-numeric: tabular-nums;
  }
  #best {
    font-family: "Permanent Marker", cursive; font-size: 17px; color: #ffcf4d;
    text-shadow: 0 0 2px #000, 2px 2px 0 #3a220c; margin: 6px 0 0 2px; letter-spacing: .06em;
  }

  #lives { position: absolute; right: 30px; top: 16px; text-align: right; }
  #lives .x {
    font-family: "Permanent Marker", cursive; font-size: 44px; line-height: 1;
    color: #4fa7e8; -webkit-text-stroke: 1px #123; margin-left: 10px;
    text-shadow: 0 0 2px #000, 2px 3px 0 #16273a, 0 5px 14px #000b;
    display: inline-block; transition: color .15s, transform .15s;
  }
  #lives .x.lost { color: #e8372b; text-shadow: 0 0 2px #000, 2px 3px 0 #3a1210, 0 5px 14px #000b;
                   transform: scale(1.12); }
  #practice {
    font-family: "Permanent Marker", cursive; font-size: 14px; color: #ffcf4d;
    text-shadow: 0 0 2px #000, 1px 2px 0 #3a220c; margin-top: 4px; letter-spacing: .08em;
  }

  /* Multiplayer scoreboard — hidden until a second phone joins the lobby. */
  #players {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    display: none; flex-direction: column; gap: 4px; align-items: center;
    background: #1d1006cc; border: 1px solid #4a3319; border-radius: 14px;
    padding: 10px 16px; backdrop-filter: blur(8px);
  }
  #players.on { display: flex; }
  #players .prow {
    font-family: "Permanent Marker", cursive; font-size: 17px; color: #f5ead6;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  #players .prow b { color: #ffcf4d; }
  #players .pdot {
    width: 11px; height: 11px; border-radius: 50%; flex: none;
    box-shadow: 0 0 6px currentColor, inset 0 0 0 1px #0006;
  }

  /* Floating slice text. */
  #fx { position: absolute; inset: 0; overflow: hidden; }
  .splash {
    position: absolute; transform: translate(-50%, -50%);
    font-family: "Permanent Marker", cursive; white-space: nowrap;
    animation: splash-pop .95s ease-out forwards; will-change: transform, opacity;
  }
  .splash.plus { font-size: 46px; color: #fff; text-shadow: 0 0 2px #000, 2px 2px 0 #3a220c; }
  .splash.combo { font-size: 72px; color: #ffb52e;
    text-shadow: 0 0 3px #000, 3px 3px 0 #4a2a08, 0 0 26px #ffb52e88; }
  .splash.crit { font-size: 84px; color: #ffe14d;
    text-shadow: 0 0 3px #000, 3px 3px 0 #4a3708, 0 0 30px #ffe14daa; }
  .splash.penalty { font-size: 64px; color: #ff5040;
    text-shadow: 0 0 3px #000, 3px 3px 0 #3a0e08; }
  @keyframes splash-pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-6deg); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); }
    30%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -68%) scale(1); }
  }

  /* The red ✗ where a fruit hit the floor. */
  #miss-x {
    position: absolute; bottom: 16%; left: 50%; transform: translate(-50%, 0) scale(.3);
    font-family: "Permanent Marker", cursive; font-size: 96px; color: #e8372b;
    text-shadow: 0 0 4px #000, 4px 4px 0 #3a0e08; opacity: 0; pointer-events: none;
  }
  #miss-x.on { animation: miss-pop .75s ease-out forwards; }
  @keyframes miss-pop {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.3); }
    20%  { opacity: 1; transform: translate(-50%, 0) scale(1.25); }
    35%  { transform: translate(-50%, 0) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, 0) scale(1.05); }
  }

  /* Bomb hit: white-out. */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: white-out .55s ease-out forwards; }
  @keyframes white-out { 0% { opacity: 1; } 100% { opacity: 0; } }

  #link {
    position: absolute; right: 30px; bottom: 24px; display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: #d8c2a0; background: #1d1006cc; border: 1px solid #4a3319;
    padding: 9px 14px; border-radius: 999px; backdrop-filter: blur(8px);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b5638; }
  .dot.on { background: #35d07f; box-shadow: 0 0 10px #35d07f99; }

  #keys { position: absolute; left: 30px; bottom: 24px; font-size: 12px; color: #b39468; }
  #keys a { color: #b39468; text-decoration: none; pointer-events: auto; }
  #keys a:hover { color: #f5ead6; }
  #keys kbd {
    background: #1d1006; border: 1px solid #4a3319; border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font: inherit; font-size: 11px; color: #d8c2a0;
  }

  #toast {
    position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%);
    font-size: 13px; font-weight: 600; letter-spacing: .1em; color: #ffcf4d;
    text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .25s; white-space: nowrap;
  }
  #toast.on { opacity: 1; }
  #debug {
    position: absolute; right: 30px; top: 118px; margin: 0; display: none;
    background: #180d04dd; border: 1px solid #4a3319; border-radius: 12px;
    padding: 14px 16px; font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #d8c2a0; white-space: pre;
  }
  #debug.on { display: block; }

  /* ── Overlays ────────────────────────────────────────────────────────── */
  #overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 40%, #3a2410ee, #1d1106fa 70%);
    backdrop-filter: blur(3px); z-index: 5;
  }
  #overlay.hide { display: none; }
  .panel { text-align: center; max-width: 620px; padding: 0 32px; }
  .panel h1 {
    font-family: "Permanent Marker", cursive; font-size: 64px; margin: 0 0 10px;
    font-weight: 400; color: #fff; text-shadow: 0 0 3px #000, 4px 4px 0 #3a220c;
  }
  .panel h1 em { font-style: normal; color: #ffb52e; }
  .panel h1.gameover { color: #e8372b; font-size: 88px; letter-spacing: .02em;
    text-shadow: 0 0 4px #000, 5px 5px 0 #2a0a06, 0 0 44px #e8372b55; }
  .panel p { color: #d8c2a0; margin: 0 auto 26px; max-width: 460px; }

  .cta { margin-top: 26px; font-size: 14px; color: #b39468; }
  .cta strong { color: #f5ead6; }
  #final { font-family: "Permanent Marker", cursive; font-size: 26px; color: #f5ead6; }
  #final b { color: #ffcf4d; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="score-wrap">
    <div id="score-row"><span id="score-ico">🍉</span><span id="score-v">0</span></div>
    <div id="best">BEST: 0</div>
  </div>
  <div id="lives">
    <div><span class="x">✗</span><span class="x">✗</span><span class="x">✗</span></div>
    <div id="practice">PRACTICE · ∞ LIVES</div>
  </div>
  <div id="players"></div>
  <div id="fx"></div>
  <div id="miss-x">✗</div>
  <div id="flash"></div>
  <div id="keys">
    <a href="/" id="back">← Games</a> &nbsp;
    <kbd>Space</kbd> start &nbsp; <kbd>C</kbd> re-center &nbsp;
    <kbd>←→</kbd> pointer speed &nbsp; <kbd>D</kbd> debug
  </div>
  <div id="link"><span class="dot" id="dot"></span><span id="link-t">no remote connected</span></div>
  <div id="toast"></div>
  <pre id="debug"></pre>
</div>

<div id="overlay" class="hide">
  <div class="panel" id="panel"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
